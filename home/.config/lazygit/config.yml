# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
disableStartupPopups: true
quitOnTopLevelReturn: false
git:
  overrideGpg: true
  autoFetch: false
  branchLogCmd: git log --oneline --color=always --abbrev-commit {{branchName}} --
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
      name: delta
    - type: extDiff
      command: difft --color=always --background={{colorScheme}} --context={{diffContext}}
  commitPrefix:
    - pattern: "^\\w+\\/(\\w+-\\d+).*"
      replace: "$1 "
keybinding:
  universal:
    return: [h, <esc>]
    quit: q
    nextItem: j
    prevItem: k
    goInto: l
    focusMainView: <enter>
    nextBlock: <down>
    prevBlock: <up>
    nextTab: <right>
    prevTab: <left>
    scrollLeft: H
    scrollRight: L
    scrollUpMain-alt1: K
    scrollDownMain-alt1: J
    gotoBottom: G
    gotoTop: g
    nextPage: <c-d>
    prevPage: <c-u>
    select: <tab>
    nextScreenMode: ']'
    prevScreenMode: '['
    prevConflict: [<left>]
    nextConflict: [<right>]
    toggleRangeSelect: v
    undo: u
    redo: R
    increaseContextInDiffView: +
    decreaseContextInDiffView: '-'
    nextItem-alt: <disabled>
    prevItem-alt: <disabled>
    prevBlock-alt: <disabled>
    nextBlock-alt: <disabled>
    nextBlock-alt2: <disabled>
    prevBlock-alt2: <disabled>
    cycleDiffRenderers: "|"
  commits:
    viewResetOptions: o
    openInBrowser: x
  branches:
    renameBranch: <f2>
  stash:
    popStash: P
  status:
    checkForUpdate: <disabled>
gui:
  tabWidth: 3
  nerdFontsVersion: "3"
  filterMode: fuzzy
  useHunkModeInDiffView: false
  wrapLinesInDiffView: false
  theme:
    authorColors:
      'Jon Povirk': '#11aaff' # blue
      'Jonathan Povirk': '#11aaff' # blue
    branchColorPatterns:
      '^(main|master|trunk|develop)$': "#11cfff" # cyan
      '^release/.*': "#aa33ff" # purple
      '^integration/.*': "#11aaff" # blue
      '^feature/.*': "#0dd63c" # green
      '^bugfix/.*': "#ff3333" # red
      '^experiment/.*': "#ff9633" # orange
      '^(hitl|sitl)/*': "#ff33f1" # pink
      '.*tags.*': "#ffe733" # yellow
os:
  editPreset: nvim
customCommands:
  - key: "<c-f>"
    context: "commits"
    command: "git show {{.SelectedLocalCommit.Sha}}"
    description: "Show selected commit"
    output: terminal
